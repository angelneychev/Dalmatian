name: Build and test Dalmatian

on:
  push:
    branches:
      - dalmatian
  pull_request:
    branches:
      - dalmatian

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build src/Dalmatian.sln --configuration Release

      - name: Test
        run: dotnet test src/Dalmatian.sln --configuration Release --no-build
